<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wedding Invitation</title>

  <!-- CSS -->
  <link rel="stylesheet" href="asset/css/style.css" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- =========================
       HERO SECTION
  ========================== -->

  <section id="hero" class="hero-section">


    <!-- Background Navy -->
    <div class="hero-background">

      <div class="bg-gradient"></div>

      <div class="bg-glow glow-1"></div>
      <div class="bg-glow glow-2"></div>
      <div class="bg-glow glow-3"></div>

    </div>


    <!-- Flower Decoration -->
    <div class="hero-flower flower-left">

      <img src="img/dekorasi.png" alt="Flower Decoration">

    </div>


    <!-- Main Content -->
    <div class="hero-content">


      <!-- Welcome -->
      <div class="hero-top">

        <p class="hero-welcome">
          Welcome To
        </p>

        <h1 class="hero-title">
          The Wedding Of
        </h1>

      </div>



      <!-- Couple Photo -->
      <div class="hero-photo-wrapper">

        <div class="hero-photo-frame">

          <img src="img/pasangan.jpeg" alt="Couple Photo">

        </div>

      </div>



      <!-- Couple Name -->
      <div class="hero-couple">

        <div class="couple-man">

          <h2 class="couple-name">
            Asep Ilyas
          </h2>

        </div>


        <div class="couple-center">

          <span>&</span>

        </div>


        <div class="couple-woman">

          <h2 class="couple-name">
            Ai Siti
          </h2>

        </div>

      </div>



      <!-- Save The Date -->
      <div class="hero-bottom">

        <p class="save-text">
          Save The Date
        </p>


        <div class="wedding-date">

          <h3>07</h3>

          <span>
            December 2026
          </span>

        </div>


        <button class="open-invitation">

          <span>
            Buka Undangan
          </span>

        </button>

      </div>

    </div>

  </section>

</body>
</html>
