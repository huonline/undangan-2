<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="hero-cover" class="cover-premium">
        
        <div class="cover-background-wrapper"></div>

        <div class="frame-dome-gold"></div>

        <div class="cover-content-container">
            
            <h3 class="cover-welcome">Welcome to</h3>
            <h1 class="cover-subtitle">The Wedding of</h1>
            
            <div class="avatar-circle-gold">
                <img src="foto-pasangan.jpg" alt="Foto Pasangan" class="pair-photo">
                
                <img src="bunga.png" alt="Dekorasi Bunga" class="flower-avatar-accent">
            </div>

            <h2 class="couple-names">Asep Ilyas & Ai Siti</h2>
            
            <div class="date-wrapper">
                <p class="text-save-date">Save The Date</p>
                <p class="text-exact-date">Minggu, 07 Juni  2026</p>
            </div>

            <button class="btn-open-invitation">Buka Undangan</button>

        </div>

    </section>

</body>
</html>
