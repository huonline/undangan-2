<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTS Bank - Kartu Tanda Santri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>KTS Bank</h1>
            <p id="userName">Halo, Memuat...</p>
        </header>

        <!-- Saldo Card -->
        <div class="balance-card">
            <p>Saldo Tersedia</p>
            <h2 id="saldoAmmount">Rp 0</h2>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="btnSetor" class="btn-primary">Setor</button>
            <button id="btnTarik" class="btn-danger">Tarik Tunai</button>
        </div>

        <!-- Modal Tarik Tunai (Tersembunyi by default) -->
        <div id="modalTarik" class="modal hidden">
            <div class="modal-content">
                <h3>Tarik Tunai</h3>
                <input type="number" id="inputNominal" placeholder="Masukkan nominal...">
                <div class="modal-actions">
                    <button id="btnBatal" class="btn-secondary">Batal</button>
                    <button id="btnKonfirmasiTarik" class="btn-danger">Tarik</button>
                </div>
            </div>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="history-section">
            <h3>Riwayat Transaksi</h3>
            <ul id="historyList">
                <li>Memuat riwayat...</li>
            </ul>
        </div>
    </div>

    <!-- Hubungkan ke logika Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
