<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTS Bank - Kartu Tanda Santri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Head<!-- Header & Input ID Card -->
        <!-- Header & Input ID Card -->
      <header>
            <h1>KTS Bank</h1>
            <div class="id-input-box" style="margin-top: 15px;">
                <input type="text" id="inputKartuID" placeholder="Masukkan ID KTP / KTS..." style="width: 70%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                <button id="btnCekID" style="width: 25%; padding: 8px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">Cari</button>
            </div>
            <!-- Tombol NFC Baru -->
            <button id="btnScanNFC" style="width: 100%; padding: 10px; background: #8e44ad; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold;">💳 Tap KTP/KTS (NFC)</button>
            
            <p id="userName" style="margin-top: 10px;">ID Aktif: <strong id="displayID">-</strong></p>
        </header>
        <!-- Saldo Card -->
        <div class="balance-card">
            <p>Saldo Tersedia</p>
            <h2 id="saldoAmmount">Rp 0</h2>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="btnSetor" class="btn-primary">Setor</button>
            <button id="btnTarik" class="btn-danger">Tarik Tunai</button>
        </div>

        <!-- Modal Tarik Tunai (Tersembunyi by default) -->
        <div id="modalTarik" class="modal hidden">
            <div class="modal-content">
                <h3>Tarik Tunai</h3>
                <input type="number" id="inputNominal" placeholder="Masukkan nominal...">
                <div class="modal-actions">
                    <button id="btnBatal" class="btn-secondary">Batal</button>
                    <button id="btnKonfirmasiTarik" class="btn-danger">Tarik</button>
                </div>
            </div>
        </div>

        <!-- Modal Setor Tunai -->
        <div id="modalSetor" class="modal hidden">
            <div class="modal-content">
                <h3>Setor Tunai</h3>
                <input type="number" id="inputNominalSetor" placeholder="Masukkan nominal setor...">
                <div class="modal-actions">
                    <button id="btnBatalSetor" class="btn-secondary">Batal</button>
                    <button id="btnKonfirmasiSetor" class="btn-primary">Setor</button>
                </div>
            </div>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="history-section">
            <h3>Riwayat Transaksi</h3>
            <ul id="historyList">
                <li>Memuat riwayat...</li>
            </ul>
        </div>
    </div>

    <!-- Hubungkan ke logika Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
