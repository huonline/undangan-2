<body>

           <!-- FIGURA BENTUK MASJID UTAMA -->

    </div>
    
    <!-- Dekorasi Bunga (Otomatis menyesuaikan di sudut bawah kubah) -->

</div>

            <!-- Teks Nama Pasangan -->
